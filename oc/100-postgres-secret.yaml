---
kind: Secret
apiVersion: v1
metadata:
  name: html-openshift-app-database
  labels:
    app: html-openshift-app
    app.kubernetes.io/part-of: html-openshift-app
# WICHTIG: Werte unter "data:" muessen base64-codiert sein (NICHT Klartext).
# Aktuelle Werte (decodiert):
#   database-host     = counter-database   <-- ANPASSEN: = Name des DB-Service (030-service.yaml)
#   database-name     = database           <-- ANPASSEN: gewuenschter DB-Name
#   database-password = password           <-- ANPASSEN: echtes Passwort setzen!
#   database-user     = user               <-- ANPASSEN: gewuenschter DB-User
# Codieren:   echo -n 'meinwert' | base64
# Tipp: statt "data:" + base64 kann man auch "stringData:" + Klartext nehmen,
#       dann codiert OpenShift automatisch.
data:
  database-host: Y291bnRlci1kYXRhYmFzZQ==
  database-name: ZGF0YWJhc2U=
  database-password: cGFzc3dvcmQ=
  database-user: dXNlcg==
type: Opaque
