---
kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: html-openshift-app-hpa
  namespace: 264493-zlic-dvoegele001
  labels:
    app: html-openshift-app
    app.kubernetes.io/part-of: html-openshift-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: html-openshift-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          averageUtilization: 80
          type: Utilization
    # Zum Skalieren auch nach RAM (zusaetzlich zu CPU) diesen Block einkommentieren.
    # Wichtig: das Deployment muss memory requests/limits gesetzt haben (haben wir).
    # - type: Resource
    #   resource:
    #     name: memory
    #     target:
    #       averageUtilization: 80
    #       type: Utilization
